<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/cad_reembolso.js" defer></script>
    <title>Cadastrar Reembolso</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
            <a href="./reembolso_cadastrar.html">Cadastrar </a>&emsp;
            <a href="./reembolso_listar.html">Listar</a>&emsp;
            <a href="./reembolso_consultar.html">Consultar</a>&emsp;
            <a href="./reembolso_apagar.html">Apagar</a>
        </nav>
    </header>
    <main>
        <h1>Cadastro Reembolso</h1>
        <br><br>
        <form>
            <label for="nome">Nome do Motorista</label><br>
            <input type="text" id="nome"><br><br>
            
            <label for="modelo">Modelo do Veículo</label><br>
            <input type="text" id="modelo"><br><br>
            
            <label for="ajudaCusto">Ajuda de Custo Fixa</label><br>
            <input type="text" id="ajudaCusto"><br><br>
            
            <label for="diasEmTransito">Dias em Trânsito</label><br>
            <input type="text" id="diasEmTransito"><br><br>
            
            <select id="categoriaRota">
                <option value="regional">Regional</option>
                <option value="interestadual">Interestadual</option>
                <option value="internacional">Internacional</option>
            </select><br><br>
            
            <button id="btn_cadastrar">Cadastrar</button><br><br><br>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
